name: Deploy staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diar-business-os-staging
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployment preflight
        run: npm run preflight

      - name: Baseline existing staging D1 migrations
        run: npx wrangler d1 execute diar-business-os-staging --remote --env staging --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0001_init.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0002_domain_engine.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0003_monetization.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0004_partner_portal.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0005_sla_billing.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0006_onboarding_contracts.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0007_identity_subscriptions.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0008_solar_intelligence.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0009_attribution.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0010_experiments.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0011_personalization.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0012_project_readiness.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0013_provider_copilot.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0014_followup_crm.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0015_project_deal_room.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0016_diar_core.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0017_tenant_core_v2.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0018_tenant_security_partner_offer_v3.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0019_dubaiestate24_v4.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0020_audience_demo_v5.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0021_proposal_engine_v6.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0022_prospect_intake_v7.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0023_prospect_factory_v8.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0024_v9_hardening_opportunity.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0025_personal_business_v10.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0026_bocobites_pilot_v11.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0027_v13_consolidated_archetypes.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0028_v14_production_hardening.sql'); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0029_v15_deployment_environments.sql');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply staging D1 migrations
        run: npm run db:migrate:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy staging Worker
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
