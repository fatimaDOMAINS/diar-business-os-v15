<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarEnergy24 Provider Account</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">SolarEnergy24 Provider Account</div><nav><a href="/">Marketplace</a><a href="/partner.html">Partner Portal</a></nav></header>
<main><section><h1>V10 — Contract & Subscription</h1><div id="login" class="card">Checking secure link…</div><div id="acct"></div></section></main>
<script>
let session=localStorage.getItem('solarenergy24_session')||'';
async function boot(){const token=new URLSearchParams(location.search).get('token');if(token){const d=await (await fetch('/api/login/exchange',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token})})).json();if(d.session){session=d.session;localStorage.setItem('solarenergy24_session',session);history.replaceState({},'',location.pathname)}}if(!session){login.innerHTML='<p>No active provider session. Request a magic link from the platform owner.</p>';return}const p=await (await fetch('/api/provider/profile',{headers:{authorization:'Bearer '+session}})).json();login.innerHTML=`<h3>${p.name||'Provider'}</h3><p>${p.provider_type||''} · ${p.country||''}</p><p>Review: ${p.review_status||'pending'} · Contract: ${p.contract_status||'—'} · Subscription: ${p.subscription_status||'—'} · Marketplace: ${p.marketplace_enabled?'Active':'Paused'}</p>`;acct.innerHTML=`<div class="card form"><input id="signer" placeholder="Authorized representative"><button onclick="accept()">Accept commercial terms</button><div id="res"></div></div>`}
async function accept(){const d=await (await fetch('/api/provider/contract/accept',{method:'POST',headers:{authorization:'Bearer '+session,'content-type':'application/json'},body:JSON.stringify({accepted_by:signer.value})})).json();res.textContent=d.ok?'Terms accepted. Marketplace activation also requires approved provider review and subscription status.':(d.error||'Unable to accept.')}
boot();
</script></body></html>
