<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarEnergy24 GOLD Partner Portal</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">SolarEnergy24 GOLD Partner Portal</div><nav><a href="/">Marketplace</a><a href="/account.html">Account</a><a href="/apply.html">Join Network</a></nav></header>
<main><section><h1>GOLD Solar Provider Workspace</h1><div class="card form"><input id="pid" placeholder="Provider ID"><input id="partnerkey" placeholder="Legacy partner key (only if enabled)"><button onclick="loadPortal()">Open portal</button><div id="profile"></div></div></section>
<section><h2>Monthly statement</h2><div class="card"><input id="month" type="month"><button onclick="loadStatement()">Load statement</button><div id="statementBox"></div></div></section>
<section><h2>Assigned solar opportunities</h2><div id="leads"></div></section><section><h2>V17 — Follow-up Queue</h2><div id="followups"></div></section></main>
<script>
let providerId='',session=localStorage.getItem('solarenergy24_session')||'';function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function headers(){const h={};if(session)h.authorization='Bearer '+session;else{h['x-provider-id']=providerId;h['x-partner-key']=partnerkey.value}return h}
async function loadPortal(){providerId=pid.value.trim();const p=await (await fetch('/api/provider/profile',{headers:headers()})).json();profile.innerHTML=p.error?`<p>${esc(p.error)}</p>`:`<h3>${esc(p.name)}</h3><p>${esc(p.provider_type)} · ${esc(p.country||'')} · SLA ${p.sla_minutes||240} min</p><small>Verified ${p.verified?'Yes':'No / pending'} · Review ${esc(p.review_status||'pending')} · Contract ${esc(p.contract_status||'—')} · Subscription ${esc(p.subscription_status||'—')} · Marketplace ${p.marketplace_enabled?'Active':'Paused'}</small>`;await loadLeads();await loadFollowups()}
async function loadLeads(){const d=await (await fetch('/api/provider/leads',{headers:headers()})).json();leads.innerHTML=(d.leads||[]).map(l=>`<div class="card" style="margin:12px 0"><b>${esc(l.buyer_type)} · ${esc(l.project_type)}</b><p>${esc(l.country||'')} / ${esc(l.city||'')} · ${esc(l.property_type||'')} · ${esc(l.estimated_consumption_text||'')}</p><p>${esc(l.notes||'')}</p><small>Status ${esc(l.partner_status)} · SLA due ${esc(l.sla_due_at||'—')} · reroutes ${l.reroute_count||0}${l.owner_attention?' · OWNER ATTENTION':''}</small><div style="margin-top:10px"><button onclick="act('${l.id}','accept')">Accept</button> <button onclick="act('${l.id}','decline')">Decline</button> <button onclick="act('${l.id}','contacted')">Contacted</button> <button onclick="act('${l.id}','completed')">Completed</button> <button onclick="copilot('${l.id}','first_response')">Copilot</button> <a class="btn" href="/deal-room.html?lead_id=${encodeURIComponent(l.id)}">Deal Room</a></div><div id="cp-${l.id}"></div></div>`).join('')||'<p>No assigned opportunities.</p>'}
async function act(id,action){const note=prompt('Administrative note (optional)')||'';await fetch('/api/provider/lead-action',{method:'POST',headers:{...headers(),'content-type':'application/json'},body:JSON.stringify({lead_id:id,action,note})});await loadLeads();await loadFollowups()}
async function loadStatement(){const m=month.value||new Date().toISOString().slice(0,7);const d=await (await fetch('/api/provider/statement?month='+m,{headers:headers()})).json();statementBox.innerHTML=d.total_usd!=null?`<p>Monthly fee $${d.monthly_fee_usd} + lead fees $${d.lead_fees_usd} = <b>$${d.total_usd}</b></p>`:`<p>${esc(d.error||'Unavailable')}</p>`}
loadPortal();

async function copilot(id,type){const d=await (await fetch('/api/provider/copilot',{method:'POST',headers:{...headers(),'content-type':'application/json'},body:JSON.stringify({lead_id:id,draft_type:type})})).json();const el=document.getElementById('cp-'+id);if(el)el.innerHTML=d.error?`<p>${esc(d.error)}</p>`:`<div class="card"><b>${esc(d.type)}</b><p>${esc(d.output)}</p></div>`}
async function loadFollowups(){const d=await (await fetch('/api/provider/followups',{headers:headers()})).json();followups.innerHTML=(d.followups||[]).map(f=>`<div class="card" style="margin:12px 0"><b>${esc(f.buyer_type)} · ${esc(f.followup_type)}</b><p>${esc(f.project_type)} · ${esc(f.country||'')} / ${esc(f.city||'')} · ${esc(f.property_type||'')} · ${esc(f.readiness_band||'')} ${f.readiness_score??''}/100</p><small>Due ${esc(f.due_at)}</small><div style="margin-top:10px"><button onclick="fup('${f.id}','complete')">Complete</button> <button onclick="fup('${f.id}','snooze')">Snooze 24h</button></div></div>`).join('')||'<p>No open follow-ups.</p>'}
async function fup(id,action){await fetch('/api/provider/followup-action',{method:'POST',headers:{...headers(),'content-type':'application/json'},body:JSON.stringify({followup_id:id,action,hours:24})});await loadFollowups()}
</script></body></html>
