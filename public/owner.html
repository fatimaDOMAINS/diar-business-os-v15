<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SolarEnergy24 GOLD Owner</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">SolarEnergy24 GOLD</div><nav><a href="/">Marketplace</a><a href="/apply.html">Provider Application</a><a href="/partner.html">Partner Portal</a><a href="/enterprise-analytics.html">Enterprise Analytics</a></nav></header>
<main><section><h1>V8–V10 Business Control</h1><div class="card form"><input id="akey" placeholder="Admin key"><button onclick="load()">Load dashboard</button><button onclick="sweep()">Run SLA sweep</button></div><div id="stats" class="grid" style="margin-top:18px"></div></section>
<section><h2>Applications</h2><div id="apps"></div></section><section><h2>Provider Reviews</h2><div id="reviews"></div></section></main>
<script>
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function h(){return {'x-admin-key':akey.value}}
async function load(){const s=await (await fetch('/api/owner/stats',{headers:h()})).json();stats.innerHTML=[['Providers',s.providers],['Live',s.live_providers],['Pending reviews',s.pending_reviews],['Leads',s.leads],['Accepted',s.accepted],['SLA breaches',s.sla_breaches],['Owner attention',s.owner_attention],['Billable USD',s.billable_usd]].map(x=>`<div class="tile"><b>${esc(x[0])}</b><span style="font-size:28px">${esc(x[1]??0)}</span></div>`).join('');
const a=await (await fetch('/api/owner/applications',{headers:h()})).json();apps.innerHTML=(a.applications||[]).map(x=>`<div class="provider"><b>${esc(x.company_name)}</b> · ${esc(x.provider_type)} · ${esc(x.country||'')} · ${esc(x.status)}${x.status==='pending'?`<div><button onclick="reviewApp('${x.id}','approve')">Approve setup</button> <button onclick="reviewApp('${x.id}','reject')">Reject</button></div>`:''}</div>`).join('')||'<p>No applications.</p>';
const r=await (await fetch('/api/owner/reviews',{headers:h()})).json();reviews.innerHTML=(r.reviews||[]).map(x=>`<div class="provider"><b>${esc(x.name)}</b> · ${esc(x.review_status)}<br><small>Identity ${esc(x.identity_check)} · Licensing ${esc(x.licensing_check)} · Engineering ${esc(x.engineering_check)} · Grid ${esc(x.grid_scope_check)} · Certification ${esc(x.certification_check)}</small><div><button onclick="approveReview('${x.provider_id}')">Approve review</button><button onclick="magic('${x.provider_id}')">Magic link</button><button onclick="sub('${x.provider_id}','active')">Activate subscription</button><button onclick="sub('${x.provider_id}','paused')">Pause</button></div></div>`).join('')}
async function reviewApp(id,decision){await fetch('/api/owner/application-review',{method:'POST',headers:{...h(),'content-type':'application/json'},body:JSON.stringify({application_id:id,decision})});await load()}
async function approveReview(id){await fetch('/api/owner/review-update',{method:'POST',headers:{...h(),'content-type':'application/json'},body:JSON.stringify({provider_id:id,identity_check:'passed',licensing_check:'passed',engineering_check:'passed',grid_scope_check:'passed',certification_check:'passed',review_status:'approved',reviewer_note:'Owner-approved after evidence review.'})});await load()}
async function magic(id){const d=await (await fetch('/api/owner/magic-link',{method:'POST',headers:{...h(),'content-type':'application/json'},body:JSON.stringify({provider_id:id})})).json();prompt('15-minute magic link',d.magic_url||d.error||'')}
async function sub(id,status){await fetch('/api/owner/subscription',{method:'POST',headers:{...h(),'content-type':'application/json'},body:JSON.stringify({provider_id:id,status})});await load()}
async function sweep(){const d=await (await fetch('/api/owner/sla-sweep',{method:'POST',headers:h()})).json();alert(`Checked ${d.checked||0}, rerouted ${d.rerouted||0}, escalated ${d.escalated||0}`);await load()}
</script></body></html>
