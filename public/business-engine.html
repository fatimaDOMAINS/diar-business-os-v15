<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIAR Business Engine</title><link rel="stylesheet" href="style.css"><style>main{max-width:980px;margin:auto;padding:56px 20px}.hero{padding:54px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{border:1px solid #ddd;border-radius:18px;padding:20px}.actions{display:flex;gap:10px;flex-wrap:wrap}input,textarea,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #bbb}textarea{width:100%;min-height:100px;box-sizing:border-box}button{cursor:pointer}.result{white-space:pre-wrap;margin-top:18px}</style></head><body><main><section class="hero"><p>DIAR BUSINESS ENGINE</p><h1 id="brand">Digital business, configured to your market.</h1><p id="tagline">Browse, ask AI, or take direct action.</p><div class="actions"><button onclick="go('browse')">Browse</button><button onclick="go('ai')">Ask AI</button><button onclick="go('action')">Take action</button></div></section><section class="grid"><div class="card"><h2>Browse</h2><p>Explore the tenant's configured offers without forcing an AI conversation.</p></div><div class="card"><h2>AI Advisor</h2><textarea id="query" placeholder="Describe what you need..."></textarea><button onclick="ask()">Analyse need</button></div><div class="card"><h2>Direct action</h2><input id="contact" placeholder="Email or phone"><select id="mode"><option>lead</option><option>quote</option><option>booking</option><option>application</option><option selected>match</option></select><button onclick="lead()">Continue</button></div></section><div id="result" class="result"></div></main><script>
const qs=new URLSearchParams(location.search),tenant=qs.get('tenant')||'dubaiestate24',out=document.querySelector('#result');async function api(path,opt={}){const sep=path.includes('?')?'&':'?';const r=await fetch('/api/core/'+path+sep+'tenant='+encodeURIComponent(tenant),opt);return r.json()}async function init(){const c=await api('config');brand.textContent=c.settings?.brand?.name||c.tenant?.name||'Digital Business';tagline.textContent=c.settings?.brand?.tagline||'Browse, ask AI, or take direct action.';mode.innerHTML=(c.conversion_modes||['lead']).map(x=>`<option>${x}</option>`).join('')}function go(x){document.querySelector('#'+(x==='action'?'contact':x==='ai'?'query':'result')).scrollIntoView({behavior:'smooth'})}async function ask(){out.textContent='Working…';out.textContent=JSON.stringify(await api('advisor',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tenant_slug:tenant,query:query.value})}),null,2)}async function lead(){out.textContent='Creating qualified lead…';out.textContent=JSON.stringify(await api('lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tenant_slug:tenant,contact:contact.value,query:query.value||'general enquiry',conversion_mode:mode.value,source:{surface:'business-engine'}})}),null,2)}init();</script></body></html>
