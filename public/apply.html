<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join SolarEnergy24 Provider Network</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">SolarEnergy24 Provider Network</div><nav><a href="/">Marketplace</a><a href="/partner.html">Partner Portal</a></nav></header>
<main><section><h1>V9 — Solar Provider Onboarding</h1><div class="card form">
<input id="company" placeholder="Company name"><input id="contactname" placeholder="Contact person"><input id="email" placeholder="Email"><input id="phone" placeholder="Phone / WhatsApp">
<select id="ptype"><option value="installer">Residential Installer</option><option value="epc">Commercial EPC</option><option value="storage-integrator">Storage Integrator</option><option value="developer">Utility-scale Developer</option><option value="financing">Financing Partner</option><option value="software">Monitoring / Software</option></select>
<input id="country" placeholder="Country"><input id="city" placeholder="City"><textarea id="services" placeholder="Services"></textarea><input id="systemtypes" placeholder="System types"><input id="commercial" placeholder="Commercial model claimed">
<textarea id="licensing" placeholder="Licensing / registration claimed"></textarea><textarea id="engineering" placeholder="Engineering credentials claimed"></textarea><textarea id="grid" placeholder="Grid / interconnection scope claimed"></textarea><textarea id="certs" placeholder="Certifications claimed"></textarea>
<select id="storagecap"><option value="0">No storage capability claimed</option><option value="1">Storage capability claimed</option></select><input id="website" placeholder="Website">
<select id="package"><option value="free">Free Solar Provider Listing</option><option value="partner">Solar Project Partner</option><option value="featured">Featured Solar Partner</option><option value="enterprise">Solar Platform Enterprise</option></select>
<textarea id="notes" placeholder="Additional project / engineering information"></textarea><button onclick="submitApp()">Submit application</button><div id="msg"></div></div></section></main>
<script>
async function submitApp(){const body={company_name:company.value,contact_name:contactname.value,email:email.value,phone:phone.value,provider_type:ptype.value,country:country.value,city:city.value,services:services.value,system_types:systemtypes.value,commercial_model_claimed:commercial.value,licensing_claimed:licensing.value,engineering_credentials_claimed:engineering.value,grid_interconnection_scope_claimed:grid.value,certifications_claimed:certs.value,storage_capability_claimed:storagecap.value==='1',website:website.value,package_id:package.value,notes:notes.value};const d=await (await fetch('/api/apply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})).json();msg.textContent=d.ok?'Application received. Licensing, engineering, grid-scope and certification review is required before marketplace activation.':(d.error||'Unable to submit.')}
</script></body></html>
